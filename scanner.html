<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrance Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1e28;--mut:#6b7185;--pri:#5b4bdb;--bd:#e2e5ee;--ok:#1f9d55;--warn:#d98a00;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#14161d;--card:#1d2029;--tx:#eceef5;--mut:#9aa1b8;--bd:#2c3040}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:480px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h1{font-size:19px;margin:0}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{padding:12px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:80px}
#res{border-radius:12px;padding:18px;text-align:center;color:#fff;font-weight:600;margin-bottom:14px;display:none}
#res small{display:block;font-weight:400;margin-top:4px;opacity:.9}
.r-ok{background:var(--ok)}.r-used{background:var(--warn)}.r-bad{background:var(--bad)}
.row{display:flex;gap:8px}.row input{margin:0}
.log{font-size:13px;color:var(--mut);margin:0;padding:0;list-style:none}
.log li{padding:6px 0;border-bottom:1px solid var(--bd)}
#login{margin-top:14vh}
</style>
</head>
<body>
<div class="wrap">

<div id="login" class="card">
  <h1 style="margin-bottom:12px">Entrance Scanner</h1>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn" style="width:100%">Login</button>
</div>

<div id="app" class="hide">
  <div class="top"><h1 id="evTitle">Scanner</h1><button class="sec" id="logoutBtn">Logout</button></div>
  <select id="evSel" class="hide"></select>

  <div class="card"><div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Invited</span></div>
    <div class="stat"><b id="sUsed">0</b><span>Arrived</span></div>
    <div class="stat"><b id="sLeft">0</b><span>Remaining</span></div>
  </div></div>

  <div id="res"></div>

  <div class="card">
    <div id="reader"></div>
    <div class="row" style="margin-top:10px">
      <button id="camBtn" style="flex:1">Start camera</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <input id="manual" placeholder="Type code manually" autocapitalize="characters">
      <button id="manBtn">Check</button>
    </div>
  </div>

  <div class="card"><b style="font-size:14px">Recent scans</b><ul class="log" id="log"></ul></div>
</div>
</div>

<script>
// ====== SAME SUPABASE DETAILS AS YOUR ADMIN ======
const SUPABASE_URL = 'https://fwqsidukxvfitsdnfopg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cXNpZHVreHZmaXRzZG5mb3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NDM5MzUsImV4cCI6MjExMDIxOTkzNX0.sjhynhUJMIJaEC9jxb44VjEziOO9clXtcy0rEVB-J54';
// =================================================
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let events=[], ev=null, scanner=null, running=false, last={code:'',t:0}, busy=false;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  session?enter():show(false);
}
function show(on){$('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on)}
$('loginBtn').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error) return alert(error.message);
  enter();
};
$('logoutBtn').onclick=async()=>{await stop();await sb.auth.signOut();show(false)};

async function enter(){
  show(true);
  const {data,error}=await sb.from('events').select('id,name,event_date').order('created_at',{ascending:false});
  if(error||!data.length){$('evTitle').textContent='No event found for this login';return}
  events=data;
  $('evSel').innerHTML=events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  $('evSel').classList.toggle('hide',events.length<2);
  pick();
}
$('evSel').onchange=pick;
function pick(){
  ev=events.find(e=>e.id===$('evSel').value)||events[0];
  $('evTitle').textContent=ev.name;stats();
}
async function stats(){
  const c=async u=>{let q=sb.from('passes').select('id',{count:'exact',head:true}).eq('event_id',ev.id);if(u)q=q.eq('status','used');return (await q).count||0};
  const [t,u]=await Promise.all([c(),c(true)]);
  $('sTotal').textContent=t;$('sUsed').textContent=u;$('sLeft').textContent=t-u;
}

function showRes(cls,title,sub){
  const r=$('res');r.className='r-'+cls;r.style.display='block';
  r.innerHTML=title+(sub?`<small>${esc(sub)}</small>`:'');
  if(navigator.vibrate) navigator.vibrate(cls==='ok'?80:[120,60,120]);
}
function addLog(code,txt){
  const li=document.createElement('li');
  li.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'  '+code+'  '+txt;
  $('log').prepend(li);
  while($('log').children.length>15) $('log').lastChild.remove();
}
async function check(raw){
  const code=String(raw).trim().toUpperCase();
  if(!code||busy) return;
  busy=true;
  try{
    const {data,error}=await sb.rpc('check_in',{p_code:code});
    if(error) throw error;
    const name=data.guest_name||'';
    if(data.result==='ok'){showRes('ok','✔ Welcome',name||code);addLog(code,'ok '+name);}
    else if(data.result==='used'){
      const t=data.at?new Date(data.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';
      showRes('used','Already used',(name?name+' · ':'')+(t?'scanned at '+t:''));addLog(code,'ALREADY USED');
    }
    else if(data.result==='wrong_event'){showRes('bad','Not for this event',code);addLog(code,'wrong event');}
    else{showRes('bad','Invalid code',code);addLog(code,'invalid');}
    stats();
  }catch(e){showRes('bad','Error',e.message)}
  setTimeout(()=>busy=false,600);
}
$('manBtn').onclick=()=>{check($('manual').value);$('manual').value=''};

async function start(){
  scanner=new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},txt=>{
      const now=Date.now();
      if(txt===last.code&&now-last.t<4000) return;
      last={code:txt,t:now};check(txt);
    });
    running=true;$('camBtn').textContent='Stop camera';
  }catch(e){alert('Camera error: '+e)}
}
async function stop(){
  if(scanner&&running){try{await scanner.stop()}catch(e){}scanner.clear();running=false}
  $('camBtn').textContent='Start camera';
}
$('camBtn').onclick=()=>running?stop():start();
boot();
</script>
</body>
</html>
